# Dynamic port for Render (defaults to 8080 locally)
server.port=${PORT:8080}

# Database Connection (Reads from Render Environment Variables, falls back to local MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/book_worms?useSSL=false&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:12345678}

# JPA / Hibernate Configuration
# 'update' automatically creates your tables in Aiven's empty defaultdb on first boot
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Keep HikariCP connection pool small for Aiven's free tier limit
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000

# Jackson Settings
spring.jackson.mapper.accept-case-insensitive-enums=true